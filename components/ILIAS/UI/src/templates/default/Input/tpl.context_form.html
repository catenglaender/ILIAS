<fieldset class="c-input"
		  	data-il-ui-component="{UI_COMPONENT_NAME}"
		  	data-il-ui-input-name="{INPUT_NAME}"
			<!-- BEGIN group_context --> aria-labelledby="{GROUP_LABEL_ID2}" role="region"<!-- END group_context -->
			<!-- BEGIN disabled --> disabled="disabled"<!-- END disabled -->
			<!-- BEGIN descr_for_sections --> aria-describedby="{SECTION_BYLINE_ID}<!-- BEGIN descr_has_error --> {ERROR_ID_FOR_SECTIONS}<!-- END descr_has_error -->"
			<!-- END descr_for_sections -->
			<!-- BEGIN binding --> id="{BINDING_ID}"<!-- END binding -->
			<!-- BEGIN tabindex --> tabindex="0"<!-- END tabindex -->
		>
	<{LEGEND_OR_LABEL} class="c-input__label"
		<!-- BEGIN group_label --> id="{GROUP_LABEL_ID}"<!-- END group_label -->
		<!-- BEGIN for --> for="{ID}"<!-- END for -->
	>
		<span>{LABEL}</span><!-- BEGIN required --><span class="asterisk" aria-label="{REQUIRED_ARIA}">*</span><!-- END required -->
	</{LEGEND_OR_LABEL}>


	<!-- BEGIN byline -->
	<div id="{BYLINE_ID}" class="c-input__help-byline" role="note">{BYLINE}</div>
	<!-- END byline -->

	<div class="c-input__field">
		{INPUT}
	</div>

	<!-- BEGIN error -->
	<div class="c-input__error-msg alert alert-danger" id="{ERROR_ID}"><span class="sr-only">{ERROR_LABEL}: </span>{ERROR}</div>
	<!-- END error -->
</fieldset>
